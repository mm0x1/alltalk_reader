<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			// Apply the saved theme and reading size before first paint (see src/lib/design/).
			try {
				var theme = localStorage.getItem('readhouse:theme');
				if (theme === 'light' || theme === 'sepia' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
				}
				var size =
					localStorage.getItem('readhouse:text-size') ||
					{ large: 'large', larger: 'extra-large' }[localStorage.getItem('readhouse:reading-size')];
				if (/^(tiny|small|large|extra-large)$/.test(size || '')) {
					document.documentElement.dataset.textSize = size;
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
