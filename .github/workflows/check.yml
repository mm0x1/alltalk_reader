name: check

on:
  push:
    branches: [main, readhouse]
    # Words and screenshot baselines only: nothing CI runs looks at them (screenshots are
    # compared on macOS, locally and in the pre-push hook).
    paths-ignore: ['docs/**', '**/*.md', 'tests/visual/**']
  pull_request:

permissions:
  contents: read

# A newer push makes the run for the one before it pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, unit, audit, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm exec vitest run
      - run: pnpm audit --prod
      - run: gitleaks git --no-banner --redact

  e2e:
    name: end to end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: api, browser: '' }
          - { project: iphone, browser: webkit }
          - { project: android, browser: chromium }
          - { project: desktop, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser != ''
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
